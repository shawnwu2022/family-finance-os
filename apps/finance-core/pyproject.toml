[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "family-finance-core"
version = "0.1.0"
description = "Deterministic finance engine and AI advisor boundary for Family Finance OS"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi==0.140.0",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "SQLAlchemy==2.0.51",
  "psycopg[binary]==3.3.4",
  "uvicorn[standard]==0.51.0",
  "alembic==1.18.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10",
  "pytest-cov>=7,<8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
