name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: finance_app
          POSTGRES_PASSWORD: test-secret
          POSTGRES_DB: finance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance_app -d finance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true
      - name: Install pinned SQL tools
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          go install github.com/pressly/goose/v3/cmd/goose@v3.27.3
      - name: Generate sqlc
        run: sqlc generate
      - name: Upload sqlc generated sources
        uses: actions/upload-artifact@v4
        with:
          name: sqlc-generated
          path: internal/store/sqlc
          if-no-files-found: error
      - name: Verify sqlc generated sources are committed
        shell: bash
        run: |
          git diff --exit-code -- internal/store/sqlc
          test -z "$(git ls-files --others --exclude-standard internal/store/sqlc)"
      - name: Migration up/down/up smoke
        env:
          GOOSE_DBSTRING: postgres://finance_app:test-secret@127.0.0.1:5432/finance?sslmode=disable
        run: |
          goose -dir db/migrations postgres "$GOOSE_DBSTRING" up
          goose -dir db/migrations postgres "$GOOSE_DBSTRING" down
          goose -dir db/migrations postgres "$GOOSE_DBSTRING" up
      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Verify formatting
        shell: bash
        run: |
          mapfile -t gofiles < <(find cmd internal -type f -name '*.go' -print)
          test -z "$(gofmt -l "${gofiles[@]}")"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: PostgreSQL integration
        env:
          TEST_POSTGRES_HOST: 127.0.0.1
          TEST_POSTGRES_PORT: '5432'
          TEST_POSTGRES_DB: finance
          TEST_POSTGRES_USER: finance_app
          TEST_POSTGRES_PASSWORD: test-secret
        run: go test ./internal/store -run TestOpenPostgresIntegration -v
      - name: Race test
        run: go test -race ./...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/finance-core ./cmd/finance-core

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Finance Core image
        run: docker build -t family-finance-core:ci .
