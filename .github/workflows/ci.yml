name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: finance_app
          POSTGRES_PASSWORD: test-secret
          POSTGRES_DB: finance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance_app -d finance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true
      - name: Install pinned SQL and vulnerability tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"

          curl -fsSL -o "$RUNNER_TEMP/sqlc.tar.gz" \
            https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz
          echo "497ae4fcdfa64c5b0c311ffe4c2bd991e43991e82e5367792ed78bc2dca27354  $RUNNER_TEMP/sqlc.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/sqlc.tar.gz" -C "$RUNNER_TEMP/bin" sqlc

          curl -fsSL -o "$RUNNER_TEMP/bin/goose" \
            https://github.com/pressly/goose/releases/download/v3.27.3/goose_linux_x86_64
          echo "ca18112e2438b3ad608af9a5938beafd01fa36a4a19a3edbe4f29226ca5c8533  $RUNNER_TEMP/bin/goose" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/bin/goose"

          GOBIN="$RUNNER_TEMP/bin" go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/sqlc" version
          "$RUNNER_TEMP/bin/goose" -version
          "$RUNNER_TEMP/bin/govulncheck" -version
      - name: Generate sqlc
        run: sqlc generate
      - name: Upload sqlc generated sources
        uses: actions/upload-artifact@v4
        with:
          name: sqlc-generated
          path: internal/store/sqlc
          if-no-files-found: error
      - name: Migration up/down/up smoke
        env:
          GOOSE_DRIVER: postgres
          GOOSE_DBSTRING: postgres://finance_app:test-secret@127.0.0.1:5432/finance?sslmode=disable
          GOOSE_MIGRATION_DIR: db/migrations
        run: |
          goose up
          goose down
          goose up
      - name: Backup restore drill
        env:
          POSTGRES_DOCKER_CONTAINER: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          set -euo pipefail
          EBK_SOURCE_DB="ezbookkeeping_ci_${GITHUB_RUN_ID}"
          BACKUP_DIR="$RUNNER_TEMP/restore-drill-backup"
          ENV_FILE="$RUNNER_TEMP/restore-drill.env"
          STORAGE_ROOT="$RUNNER_TEMP/restore-storage"

          cleanup() {
            docker exec "$POSTGRES_DOCKER_CONTAINER" dropdb -U finance_app --if-exists "$EBK_SOURCE_DB" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker exec "$POSTGRES_DOCKER_CONTAINER" createdb -U finance_app "$EBK_SOURCE_DB"
          docker exec "$POSTGRES_DOCKER_CONTAINER" psql -U finance_app -d "$EBK_SOURCE_DB" -v ON_ERROR_STOP=1 \
            -c 'CREATE TABLE restore_probe (id bigint PRIMARY KEY); INSERT INTO restore_probe VALUES (1);'

          mkdir -p "$BACKUP_DIR" "$STORAGE_ROOT/ezbookkeeping-storage"
          docker exec "$POSTGRES_DOCKER_CONTAINER" pg_dump -U finance_app -d finance -Fc > "$BACKUP_DIR/finance.dump"
          docker exec "$POSTGRES_DOCKER_CONTAINER" pg_dump -U finance_app -d "$EBK_SOURCE_DB" -Fc > "$BACKUP_DIR/${EBK_SOURCE_DB}.dump"
          printf 'restore-drill\n' > "$STORAGE_ROOT/ezbookkeeping-storage/probe.txt"
          tar -C "$STORAGE_ROOT" -czf "$BACKUP_DIR/ezbookkeeping-storage.tar.gz" ezbookkeeping-storage
          (
            cd "$BACKUP_DIR"
            sha256sum finance.dump "${EBK_SOURCE_DB}.dump" ezbookkeeping-storage.tar.gz > SHA256SUMS
          )
          printf 'POSTGRES_USER=finance_app\nFINANCE_DB_NAME=finance\nEBK_DB_NAME=%s\n' "$EBK_SOURCE_DB" > "$ENV_FILE"

          FINANCE_ENV_FILE="$ENV_FILE" POSTGRES_DOCKER_CONTAINER="$POSTGRES_DOCKER_CONTAINER" \
            bash scripts/restore-drill.sh "$BACKUP_DIR"
      - name: Verify sqlc generated sources are committed
        shell: bash
        run: |
          git diff --exit-code -- internal/store/sqlc
          test -z "$(git ls-files --others --exclude-standard internal/store/sqlc)"
      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Verify formatting
        shell: bash
        run: |
          mapfile -t gofiles < <(find cmd internal -type f -name '*.go' -print)
          test -z "$(gofmt -l "${gofiles[@]}")"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Vulnerability scan
        run: govulncheck ./...
      - name: PostgreSQL integration
        env:
          TEST_POSTGRES_HOST: 127.0.0.1
          TEST_POSTGRES_PORT: '5432'
          TEST_POSTGRES_DB: finance
          TEST_POSTGRES_USER: finance_app
          TEST_POSTGRES_PASSWORD: test-secret
        run: go test ./internal/store -run TestOpenPostgresIntegration -v
      - name: Household integration
        env:
          TEST_POSTGRES_HOST: 127.0.0.1
          TEST_POSTGRES_PORT: '5432'
          TEST_POSTGRES_DB: finance
          TEST_POSTGRES_USER: finance_app
          TEST_POSTGRES_PASSWORD: test-secret
        run: go test ./internal/household -run Integration -v
      - name: Budget integration
        env:
          TEST_POSTGRES_HOST: 127.0.0.1
          TEST_POSTGRES_PORT: '5432'
          TEST_POSTGRES_DB: finance
          TEST_POSTGRES_USER: finance_app
          TEST_POSTGRES_PASSWORD: test-secret
        run: go test ./internal/budget -run Integration -v
      - name: Goals integration
        env:
          TEST_POSTGRES_HOST: 127.0.0.1
          TEST_POSTGRES_PORT: '5432'
          TEST_POSTGRES_DB: finance
          TEST_POSTGRES_USER: finance_app
          TEST_POSTGRES_PASSWORD: test-secret
        run: go test ./internal/goals -run Integration -v
      - name: Advice audit integration
        env:
          TEST_POSTGRES_HOST: 127.0.0.1
          TEST_POSTGRES_PORT: '5432'
          TEST_POSTGRES_DB: finance
          TEST_POSTGRES_USER: finance_app
          TEST_POSTGRES_PASSWORD: test-secret
        run: go test ./internal/audit -run Integration -v
      - name: Agent tool audit integration
        env:
          TEST_POSTGRES_HOST: 127.0.0.1
          TEST_POSTGRES_PORT: '5432'
          TEST_POSTGRES_DB: finance
          TEST_POSTGRES_USER: finance_app
          TEST_POSTGRES_PASSWORD: test-secret
        run: go test ./internal/audit -run TestAgentPostgresRecorder -v
      - name: Scheduler integration
        env:
          TEST_POSTGRES_HOST: 127.0.0.1
          TEST_POSTGRES_PORT: '5432'
          TEST_POSTGRES_DB: finance
          TEST_POSTGRES_USER: finance_app
          TEST_POSTGRES_PASSWORD: test-secret
        run: go test ./internal/scheduler -run Integration -v
      - name: App API integration
        env:
          TEST_POSTGRES_HOST: 127.0.0.1
          TEST_POSTGRES_PORT: '5432'
          TEST_POSTGRES_DB: finance
          TEST_POSTGRES_USER: finance_app
          TEST_POSTGRES_PASSWORD: test-secret
        run: go test ./internal/appapi -run TestPostgresPlannerRoundTripIntegration -v
      - name: Application builder integration
        env:
          TEST_POSTGRES_HOST: 127.0.0.1
          TEST_POSTGRES_PORT: '5432'
          TEST_POSTGRES_DB: finance
          TEST_POSTGRES_USER: finance_app
          TEST_POSTGRES_PASSWORD: test-secret
        run: go test ./cmd/finance-core -run TestBuildApplicationHandlerWithoutLLMIntegration -v
      - name: Race test
        run: go test -race ./...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/finance-core ./cmd/finance-core

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts
      - name: Unit test frontend
        run: npm test
      - name: Verify PWA contract
        run: npm run check:pwa
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Build frontend
        run: npm run build
      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify V1 production operations contract
        run: bash scripts/test-production-ops.sh
      - name: Verify Finance edge auth contract
        run: bash scripts/check-edge-security.sh
      - name: Build Finance Core image
        run: docker build -t family-finance-core:ci .
