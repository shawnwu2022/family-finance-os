name: Gofmt Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: false
      - name: Print unformatted Go files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t gofiles < <(find cmd internal -type f -name '*.go' -print)
          unformatted="$(gofmt -l "${gofiles[@]}")"
          if [[ -n "$unformatted" ]]; then
            printf 'UNFORMATTED FILES:\n%s\n' "$unformatted"
            exit 1
          fi
