name: OpenClaw Release Acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v2-openclaw-release-acceptance
  pull_request:
    branches:
      - feature/v2-agent-adapter

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify release acceptance contract
        shell: bash
        run: bash scripts/acceptance/test-openclaw-release-acceptance.sh
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
      - name: Run real OpenClaw release acceptance
        shell: bash
        env:
          OPENCLAW_FINANCE_SMOKE_OLLAMA_PREFLIGHT: '1'
        run: bash scripts/acceptance/openclaw-ephemeral-release-acceptance.sh
