name: ezBookkeeping npm Audit Spike

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Audit and test minimal v1.6.1 frontend security upgrade
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          src=/tmp/ezbookkeeping
          git clone --quiet https://github.com/mayswind/ezbookkeeping.git "$src"
          git -C "$src" checkout --quiet --detach 6ccd0c462100828c78e203792a5b2feb8d569039
          test "$(git -C "$src" rev-parse HEAD)" = "6ccd0c462100828c78e203792a5b2feb8d569039"

          docker run --rm \
            -v "$src":/work \
            -w /work \
            -e BUILD_PIPELINE=1 \
            node:24.19.0-bookworm-slim@sha256:3638d9a6fe4030bd716be989438248074489337ba3275657f93595428be4fc03 \
            sh -lc '
              set -eu

              audit_summary() {
                label="$1"
                file="$2"
                node -e '\''
                  const fs = require("fs");
                  const label = process.argv[1];
                  const data = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
                  const m = data.metadata?.vulnerabilities ?? {};
                  console.log(`${label}_AUDIT_TOTAL=${m.total ?? "unknown"}`);
                  console.log(`${label}_AUDIT_HIGH=${m.high ?? "unknown"}`);
                  console.log(`${label}_AUDIT_CRITICAL=${m.critical ?? "unknown"}`);
                  const findings = Object.entries(data.vulnerabilities ?? {})
                    .filter(([, v]) => v.severity === "high" || v.severity === "critical")
                    .map(([name, v]) => `${name}\t${v.severity}\tdirect=${v.isDirect}\trange=${v.range}\tfix=${JSON.stringify(v.fixAvailable)}`)
                    .sort();
                  console.log(`=== ${label} HIGH/CRITICAL ===`);
                  console.log(findings.length ? findings.join("\n") : "none");
                '\'' "$label" "$file"
              }

              npm audit --json --omit=dev > /tmp/baseline-prod.json || true
              npm audit --json > /tmp/baseline-all.json || true
              audit_summary BASELINE_PROD /tmp/baseline-prod.json
              audit_summary BASELINE_ALL /tmp/baseline-all.json

              npm install --package-lock-only --ignore-scripts --save-exact axios@1.19.0
              npm install --package-lock-only --ignore-scripts --save-dev --save-exact vite@8.2.2
              npm audit fix --package-lock-only --ignore-scripts

              test "$(node -p "require(\"./package.json\").dependencies.axios")" = "1.19.0"
              test "$(node -p "require(\"./package.json\").devDependencies.vite")" = "8.2.2"

              npm audit --json --omit=dev > /tmp/patched-prod.json || true
              npm audit --json > /tmp/patched-all.json || true
              audit_summary PATCHED_PROD /tmp/patched-prod.json
              audit_summary PATCHED_ALL /tmp/patched-all.json

              high_critical="$(node -e '\''
                const fs = require("fs");
                const data = JSON.parse(fs.readFileSync("/tmp/patched-all.json", "utf8"));
                const m = data.metadata?.vulnerabilities ?? {};
                process.stdout.write(String((m.high ?? 0) + (m.critical ?? 0)));
              '\'')"
              test "$high_critical" = "0"

              npm ci
              npm ls axios vite immutable nanoid postcss brace-expansion fast-uri js-yaml
              npm test
              npm run build
              echo EZBOOKKEEPING_FRONTEND_AUDIT_STATUS=PASS
              echo EZBOOKKEEPING_FRONTEND_TEST_STATUS=PASS
              echo EZBOOKKEEPING_FRONTEND_BUILD_STATUS=PASS
            '

          patch=/tmp/ezbookkeeping-frontend-security.patch
          git -C "$src" diff -- package.json package-lock.json > "$patch"
          test -s "$patch"
          grep -Fq '"axios": "1.19.0"' "$patch"
          grep -Fq '"vite": "8.2.2"' "$patch"
          echo "EZBOOKKEEPING_FRONTEND_PATCH_SHA256=$(sha256sum "$patch" | awk '{print $1}')"

          branch="${GITHUB_HEAD_REF}"
          path='spikes/ezbookkeeping-frontend-security.patch'
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}"
          current_sha="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' --get --data-urlencode "ref=${branch}" "$api" 2>/dev/null | jq -r '.sha // empty' || true)"
          if [ -n "$current_sha" ]; then
            jq -Rs --arg message 'spike(security): persist verified ezBookkeeping frontend patch' --arg branch "$branch" --arg sha "$current_sha" '{message:$message,content:(@base64),branch:$branch,sha:$sha}' "$patch" > /tmp/payload.json
          else
            jq -Rs --arg message 'spike(security): persist verified ezBookkeeping frontend patch' --arg branch "$branch" '{message:$message,content:(@base64),branch:$branch}' "$patch" > /tmp/payload.json
          fi
          curl -fsS -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/payload.json \
            "$api" >/dev/null
          echo 'EZBOOKKEEPING_FRONTEND_PATCH_PERSISTED=PASS'

          for image in postgres:18.6-alpine alpine:3.24 golang:1.26.6-alpine; do
            docker pull "$image" >/dev/null
            digest_ref="$(docker inspect --format '{{index .RepoDigests 0}}' "$image")"
            test -n "$digest_ref"
            echo "BASE_IMAGE=$digest_ref"
          done
          echo 'BASE_IMAGE=node:24.19.0-bookworm-slim@sha256:3638d9a6fe4030bd716be989438248074489337ba3275657f93595428be4fc03'
