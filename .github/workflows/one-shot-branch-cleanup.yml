name: Finalize one-shot branch cleanup

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  finalize:
    name: Remove final cleanup branches after workflow-removal PR merges
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'chore/final-remove-one-shot-workflow'
    runs-on: ubuntu-24.04
    steps:
      - name: Wait for removal PR merge and delete cleanup refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${GH_REPO}"
          previous_branch='chore/remove-one-shot-cleanup-32952786452'
          trigger_fix_branch='chore/fix-final-cleanup-trigger'
          final_branch='chore/final-remove-one-shot-workflow'

          gh_curl() {
            curl --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$@"
          }

          merged='false'
          for attempt in $(seq 1 120); do
            pr_json="$(gh_curl --fail-with-body "${api}/pulls/${PR_NUMBER}")"
            merged_at="$(jq -r '.merged_at // empty' <<<"$pr_json")"
            state="$(jq -r '.state' <<<"$pr_json")"
            if [[ -n "$merged_at" ]]; then
              merged='true'
              break
            fi
            if [[ "$state" == 'closed' ]]; then
              echo "Removal PR #${PR_NUMBER} closed without merge" >&2
              exit 1
            fi
            sleep 2
          done

          if [[ "$merged" != 'true' ]]; then
            echo "Timed out waiting for removal PR #${PR_NUMBER} to merge" >&2
            exit 1
          fi

          delete_ref_if_present() {
            local branch="$1"
            local status
            status="$(gh_curl \
              --output /tmp/ref-response.json \
              --write-out '%{http_code}' \
              "${api}/git/ref/heads/${branch}")"
            if [[ "$status" == '404' ]]; then
              echo "Already absent: ${branch}"
              return 0
            fi
            if [[ "$status" != '200' ]]; then
              cat /tmp/ref-response.json >&2 || true
              echo "Unable to inspect ${branch}: HTTP ${status}" >&2
              return 1
            fi

            echo "Deleting ${branch}"
            status="$(gh_curl \
              --output /tmp/delete-response.json \
              --write-out '%{http_code}' \
              --request DELETE \
              "${api}/git/refs/heads/${branch}")"
            if [[ "$status" != '204' ]]; then
              cat /tmp/delete-response.json >&2 || true
              echo "Failed to delete ${branch}: HTTP ${status}" >&2
              return 1
            fi
          }

          delete_ref_if_present "$previous_branch"
          delete_ref_if_present "$trigger_fix_branch"
          delete_ref_if_present "$final_branch"

          for branch in "$previous_branch" "$trigger_fix_branch" "$final_branch"; do
            status="$(gh_curl \
              --output /tmp/verify-response.json \
              --write-out '%{http_code}' \
              "${api}/git/ref/heads/${branch}")"
            if [[ "$status" != '404' ]]; then
              cat /tmp/verify-response.json >&2 || true
              echo "Cleanup branch still resolves: ${branch} (HTTP ${status})" >&2
              exit 1
            fi
          done

          echo 'Final cleanup refs removed.'
