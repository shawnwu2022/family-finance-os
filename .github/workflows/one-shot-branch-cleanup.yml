name: One-shot merged branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    name: Delete merged branches and self-remove
    runs-on: ubuntu-24.04
    steps:
      - name: Delete merged branches and remove this workflow through PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${GH_REPO}"
          workflow_path='.github/workflows/one-shot-branch-cleanup.yml'
          deployment_branch='chore/one-shot-merged-branch-cleanup'
          branches=(
            'design/backup-append-only-boundary'
            'docs/refresh-production-evidence-12bee8c7'
            'feat/monthly-report-persistence'
            'security/append-only-backup-boundary'
            "$deployment_branch"
          )

          gh_curl() {
            curl --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$@"
          }

          ref_status() {
            local branch="$1"
            gh_curl --output /tmp/ref-response.json --write-out '%{http_code}' \
              "${api}/git/ref/heads/${branch}"
          }

          delete_ref_if_present() {
            local branch="$1"
            local status
            status="$(ref_status "$branch")"
            if [[ "$status" == '404' ]]; then
              echo "Already absent: ${branch}"
              return 0
            fi
            if [[ "$status" != '200' ]]; then
              cat /tmp/ref-response.json >&2 || true
              echo "Unable to inspect ${branch}: HTTP ${status}" >&2
              return 1
            fi

            echo "Deleting ${branch}"
            status="$(gh_curl \
              --output /tmp/delete-response.json \
              --write-out '%{http_code}' \
              --request DELETE \
              "${api}/git/refs/heads/${branch}")"
            if [[ "$status" != '204' ]]; then
              cat /tmp/delete-response.json >&2 || true
              echo "Failed to delete ${branch}: HTTP ${status}" >&2
              return 1
            fi
          }

          for branch in "${branches[@]}"; do
            delete_ref_if_present "$branch"
          done

          for branch in "${branches[@]}"; do
            status="$(ref_status "$branch")"
            if [[ "$status" != '404' ]]; then
              cat /tmp/ref-response.json >&2 || true
              echo "Branch still resolves after cleanup: ${branch} (HTTP ${status})" >&2
              exit 1
            fi
          done

          removal_branch="chore/remove-one-shot-cleanup-${GH_RUN_ID}"
          echo "Creating self-removal branch ${removal_branch}"
          create_ref_payload="$(jq -n \
            --arg ref "refs/heads/${removal_branch}" \
            --arg sha "$GH_SHA" \
            '{ref:$ref, sha:$sha}')"
          gh_curl --fail-with-body \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "$create_ref_payload" \
            "${api}/git/refs" >/dev/null

          workflow_sha="$(gh_curl --fail-with-body \
            "${api}/contents/${workflow_path}?ref=${removal_branch}" | jq -r '.sha')"
          if [[ -z "$workflow_sha" || "$workflow_sha" == 'null' ]]; then
            echo 'Unable to resolve one-shot workflow blob SHA' >&2
            exit 1
          fi

          delete_file_payload="$(jq -n \
            --arg message 'chore: remove one-shot branch cleanup workflow' \
            --arg sha "$workflow_sha" \
            --arg branch "$removal_branch" \
            '{message:$message, sha:$sha, branch:$branch}')"
          gh_curl --fail-with-body \
            --request DELETE \
            --header 'Content-Type: application/json' \
            --data "$delete_file_payload" \
            "${api}/contents/${workflow_path}" >/dev/null

          pr_payload="$(jq -n \
            --arg title 'chore: remove one-shot branch cleanup workflow' \
            --arg head "$removal_branch" \
            --arg base 'main' \
            --arg body 'Automated self-removal after merged-branch cleanup completed.' \
            '{title:$title, head:$head, base:$base, body:$body}')"
          pr_json="$(gh_curl --fail-with-body \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "$pr_payload" \
            "${api}/pulls")"
          pr_number="$(jq -r '.number' <<<"$pr_json")"
          if [[ -z "$pr_number" || "$pr_number" == 'null' ]]; then
            echo 'Failed to create workflow self-removal PR' >&2
            exit 1
          fi
          echo "Created self-removal PR #${pr_number}"

          merge_payload='{"merge_method":"squash","commit_title":"chore: remove one-shot branch cleanup workflow"}'
          merged='false'
          for attempt in $(seq 1 30); do
            merge_status="$(gh_curl \
              --output /tmp/merge-response.json \
              --write-out '%{http_code}' \
              --request PUT \
              --header 'Content-Type: application/json' \
              --data "$merge_payload" \
              "${api}/pulls/${pr_number}/merge")"
            if [[ "$merge_status" == '200' ]] && [[ "$(jq -r '.merged // false' /tmp/merge-response.json)" == 'true' ]]; then
              merged='true'
              break
            fi
            sleep 2
          done
          if [[ "$merged" != 'true' ]]; then
            cat /tmp/merge-response.json >&2 || true
            echo "Self-removal PR #${pr_number} did not merge" >&2
            exit 1
          fi

          delete_ref_if_present "$removal_branch"

          workflow_status="$(gh_curl \
            --output /tmp/workflow-response.json \
            --write-out '%{http_code}' \
            "${api}/contents/${workflow_path}?ref=main")"
          if [[ "$workflow_status" != '404' ]]; then
            cat /tmp/workflow-response.json >&2 || true
            echo "One-shot workflow still exists on main (HTTP ${workflow_status})" >&2
            exit 1
          fi

          echo 'Merged branch cleanup and workflow self-removal completed.'
