name: Finalize V1.x merged branch cleanup

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - closed
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup-v1x:
    name: Delete merged V1.x refs after RBAC merge
    if: github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/v1-4-household-rbac'
    runs-on: ubuntu-24.04
    steps:
      - name: Verify exact heads and delete merged refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${GH_REPO}"
          deployment_branch='chore/cleanup-v1x-merged-refs'

          gh_curl() {
            curl --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$@"
          }

          ref_json() {
            local branch="$1"
            gh_curl \
              --output /tmp/ref-response.json \
              --write-out '%{http_code}' \
              "${api}/git/ref/heads/${branch}"
          }

          verify_expected_head() {
            local branch="$1"
            local expected_sha="$2"
            local status actual_sha
            status="$(ref_json "$branch")"
            if [[ "$status" == '404' ]]; then
              echo "Expected branch is already absent: ${branch}" >&2
              exit 1
            fi
            if [[ "$status" != '200' ]]; then
              cat /tmp/ref-response.json >&2 || true
              echo "Unable to inspect ${branch}: HTTP ${status}" >&2
              exit 1
            fi
            actual_sha="$(jq -r '.object.sha // empty' /tmp/ref-response.json)"
            if [[ "$actual_sha" != "$expected_sha" ]]; then
              echo "Ref moved unexpectedly: ${branch} actual=${actual_sha} expected=${expected_sha}" >&2
              exit 1
            fi
          }

          delete_ref_if_present() {
            local branch="$1"
            local status
            status="$(ref_json "$branch")"
            if [[ "$status" == '404' ]]; then
              echo "Already absent: ${branch}"
              return 0
            fi
            if [[ "$status" != '200' ]]; then
              cat /tmp/ref-response.json >&2 || true
              echo "Unable to inspect ${branch}: HTTP ${status}" >&2
              return 1
            fi

            echo "Deleting ${branch}"
            status="$(gh_curl \
              --output /tmp/delete-response.json \
              --write-out '%{http_code}' \
              --request DELETE \
              "${api}/git/refs/heads/${branch}")"
            if [[ "$status" != '204' ]]; then
              cat /tmp/delete-response.json >&2 || true
              echo "Failed to delete ${branch}: HTTP ${status}" >&2
              return 1
            fi
          }

          verify_expected_head 'chore/v1-production-acceptance-runner' '2849767088871d0c3de669bbb33ed5d429bf0d83'
          verify_expected_head 'docs/v1-production-evidence-5d123301' '4b40ad79df8295418d7b86a1480416d6e4acc100'
          verify_expected_head 'feature/v1-1-data-quality' '68a1e9e7e1b2aa0c7601d77ece470d1ad6290116'
          verify_expected_head 'feature/v1-2-local-ai' '8fae73a437fed005bf6c17f2d941eca3af0bfaa9'
          verify_expected_head 'feature/v1-4-household-rbac' '5c22f07062cae404dce0eb66face1d21d63af9af'

          branches=(
            'chore/v1-production-acceptance-runner'
            'docs/v1-production-evidence-5d123301'
            'feature/v1-1-data-quality'
            'feature/v1-2-local-ai'
            'feature/v1-4-household-rbac'
            "$deployment_branch"
          )

          for branch in "${branches[@]}"; do
            delete_ref_if_present "$branch"
          done

          for branch in "${branches[@]}"; do
            status="$(ref_json "$branch")"
            if [[ "$status" != '404' ]]; then
              cat /tmp/ref-response.json >&2 || true
              echo "Branch still resolves after cleanup: ${branch} (HTTP ${status})" >&2
              exit 1
            fi
          done

          echo 'Merged V1.x branch cleanup completed.'

  finalize-self-removal:
    name: Delete final cleanup branch after workflow removal PR merges
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'chore/remove-v1x-cleanup-workflow'
    runs-on: ubuntu-24.04
    steps:
      - name: Wait for removal PR merge and delete final ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${GH_REPO}"
          final_branch='chore/remove-v1x-cleanup-workflow'

          gh_curl() {
            curl --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$@"
          }

          merged='false'
          for attempt in $(seq 1 180); do
            pr_json="$(gh_curl --fail-with-body "${api}/pulls/${PR_NUMBER}")"
            merged_at="$(jq -r '.merged_at // empty' <<<"$pr_json")"
            state="$(jq -r '.state' <<<"$pr_json")"
            if [[ -n "$merged_at" ]]; then
              merged='true'
              break
            fi
            if [[ "$state" == 'closed' ]]; then
              echo "Final cleanup PR #${PR_NUMBER} closed without merge" >&2
              exit 1
            fi
            sleep 2
          done

          if [[ "$merged" != 'true' ]]; then
            echo "Timed out waiting for final cleanup PR #${PR_NUMBER} to merge" >&2
            exit 1
          fi

          status="$(gh_curl \
            --output /tmp/ref-response.json \
            --write-out '%{http_code}' \
            "${api}/git/ref/heads/${final_branch}")"
          if [[ "$status" == '404' ]]; then
            echo "Already absent: ${final_branch}"
            exit 0
          fi
          if [[ "$status" != '200' ]]; then
            cat /tmp/ref-response.json >&2 || true
            echo "Unable to inspect ${final_branch}: HTTP ${status}" >&2
            exit 1
          fi

          status="$(gh_curl \
            --output /tmp/delete-response.json \
            --write-out '%{http_code}' \
            --request DELETE \
            "${api}/git/refs/heads/${final_branch}")"
          if [[ "$status" != '204' ]]; then
            cat /tmp/delete-response.json >&2 || true
            echo "Failed to delete ${final_branch}: HTTP ${status}" >&2
            exit 1
          fi

          status="$(gh_curl \
            --output /tmp/verify-response.json \
            --write-out '%{http_code}' \
            "${api}/git/ref/heads/${final_branch}")"
          if [[ "$status" != '404' ]]; then
            cat /tmp/verify-response.json >&2 || true
            echo "Final cleanup branch still resolves (HTTP ${status})" >&2
            exit 1
          fi

          echo 'Final cleanup branch removed.'
