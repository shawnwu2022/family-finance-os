x-finance-core-build: &finance-core-build
  context: .
  dockerfile: Dockerfile

x-finance-database-environment: &finance-database-environment
  DB_HOST: ${DB_HOST:-postgres}
  DB_PORT: ${DB_PORT:-5432}
  DB_SSLMODE: ${DB_SSLMODE:-disable}
  DB_NAME: ${FINANCE_DB_NAME:-finance}
  DB_USER: ${FINANCE_DB_USER:-finance_app}
  DB_PASSWORD: ${FINANCE_DB_PASSWORD}

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_INITDB_ARGS: --data-checksums
      FINANCE_DB_NAME: ${FINANCE_DB_NAME:-finance}
      FINANCE_DB_USER: ${FINANCE_DB_USER:-finance_app}
      FINANCE_DB_PASSWORD: ${FINANCE_DB_PASSWORD}
      EBK_DB_NAME: ${EBK_DB_NAME:-ezbookkeeping}
      EBK_DB_USER: ${EBK_DB_USER:-ezbookkeeping_app}
      EBK_DB_PASSWORD: ${EBK_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      app:
        ipv4_address: 172.30.0.40

  ezbookkeeping:
    build:
      context: .
      dockerfile: Dockerfile.ezbookkeeping
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      EBK_SERVER_DOMAIN: ${EBK_DOMAIN}
      EBK_SERVER_ROOT_URL: https://${EBK_DOMAIN}/
      EBK_SERVER_ENABLE_GZIP: "true"
      EBK_DATABASE_TYPE: postgres
      EBK_DATABASE_HOST: postgres:5432
      EBK_DATABASE_NAME: ${EBK_DB_NAME:-ezbookkeeping}
      EBK_DATABASE_USER: ${EBK_DB_USER:-ezbookkeeping_app}
      EBK_DATABASE_PASSWD: ${EBK_DB_PASSWORD}
      EBK_DATABASE_SSL_MODE: disable
      EBK_SECURITY_SECRET_KEY_FILE: /run/secrets/ezbookkeeping-secret-key
      EBK_SECURITY_TRUSTED_PROXY_IPS: 172.30.0.10/32
      EBK_SECURITY_TOKEN_EXPIRED_TIME: "43200"
      EBK_SECURITY_TOKEN_MIN_REFRESH_INTERVAL: "1800"
      EBK_SECURITY_ENABLE_API_TOKEN: "true"
      EBK_SECURITY_API_TOKEN_ALLOWED_REMOTE_IPS: 172.30.0.30
      EBK_SECURITY_MAX_FAILURES_PER_IP_PER_MINUTE: "5"
      EBK_SECURITY_MAX_FAILURES_PER_USER_PER_MINUTE: "5"
      EBK_AUTH_ENABLE_TWO_FACTOR: "true"
      EBK_USER_ENABLE_REGISTER: ${EBK_USER_ENABLE_REGISTER:-false}
      EBK_LOG_MODE: console
    volumes:
      - ./data/ezbookkeeping-storage:/ezbookkeeping/storage
      - ${EBK_SECURITY_SECRET_KEY_HOST_FILE:?EBK_SECURITY_SECRET_KEY_HOST_FILE is required}:/run/secrets/ezbookkeeping-secret-key:ro
    networks:
      app:
        ipv4_address: 172.30.0.20

  finance-migrate:
    build: *finance-core-build
    restart: "no"
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *finance-database-environment
    networks: [app]

  finance-bootstrap:
    build: *finance-core-build
    restart: "no"
    command:
      - bootstrap
      - --name
      - ${FINANCE_BOOTSTRAP_NAME:-家庭}
      - --currency
      - ${FINANCE_BOOTSTRAP_CURRENCY:-CNY}
      - --timezone
      - ${FINANCE_BOOTSTRAP_TIMEZONE:-Asia/Shanghai}
      - --liquidity-floor-minor
      - ${FINANCE_BOOTSTRAP_LIQUIDITY_FLOOR_MINOR:-0}
    depends_on:
      finance-migrate:
        condition: service_completed_successfully
    environment:
      <<: *finance-database-environment
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      FINANCE_ADMIN_USERNAME: ${FINANCE_ADMIN_USERNAME:-finance}
      FINANCE_ADMIN_PASSWORD_FILE: /run/secrets/finance-admin-password
    volumes:
      - ${FINANCE_ADMIN_PASSWORD_HOST_FILE:?FINANCE_ADMIN_PASSWORD_HOST_FILE is required}:/run/secrets/finance-admin-password:ro
    networks: [app]

  finance-core:
    build: *finance-core-build
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ezbookkeeping:
        condition: service_started
      finance-bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *finance-database-environment
      EBK_BASE_URL: ${EBK_BASE_URL:-http://ezbookkeeping:8080/api/v1}
      EBK_API_TOKEN_FILE: /run/secrets/ezbookkeeping-api-token
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      PORTFOLIO_VALUATION_STALE_AFTER: ${PORTFOLIO_VALUATION_STALE_AFTER:-720h}
      PORTFOLIO_FX_STALE_AFTER: ${PORTFOLIO_FX_STALE_AFTER:-72h}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_FAST_MODEL: ${LLM_FAST_MODEL:-}
      LLM_PLANNER_MODEL: ${LLM_PLANNER_MODEL:-}
      LLM_REVIEWER_MODEL: ${LLM_REVIEWER_MODEL:-}
      MCP_ENABLED: ${MCP_ENABLED:-false}
      MCP_TOKEN_FILE: ${MCP_TOKEN_FILE:-/run/secrets/finance-mcp-token}
      MCP_HOUSEHOLD_ID: ${MCP_HOUSEHOLD_ID:-}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      MCP_REQUEST_TIMEOUT: ${MCP_REQUEST_TIMEOUT:-15s}
      MCP_MAX_CONCURRENT: ${MCP_MAX_CONCURRENT:-4}
      MCP_REQUESTS_PER_MINUTE: ${MCP_REQUESTS_PER_MINUTE:-60}
      MCP_MAX_BODY_BYTES: ${MCP_MAX_BODY_BYTES:-262144}
      FINANCE_AUTH_KEY_FILE: /run/secrets/finance-auth-key
      FINANCE_LISTEN_ADDR: ${FINANCE_LISTEN_ADDR:-:8000}
      FINANCE_HEALTHCHECK_URL: ${FINANCE_HEALTHCHECK_URL:-http://127.0.0.1:8000/healthz}
    volumes:
      - ${FINANCE_AUTH_KEY_HOST_FILE:?FINANCE_AUTH_KEY_HOST_FILE is required}:/run/secrets/finance-auth-key:ro
      - ${EBK_API_TOKEN_HOST_FILE:?EBK_API_TOKEN_HOST_FILE is required}:/run/secrets/ezbookkeeping-api-token:ro
      - ${MCP_TOKEN_HOST_FILE:-/dev/null}:/run/secrets/finance-mcp-token:ro
    healthcheck:
      test: ["CMD", "/finance-core", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      app:
        ipv4_address: 172.30.0.30

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    depends_on:
      - ezbookkeeping
    environment:
      EBK_DOMAIN: ${EBK_DOMAIN}
      FINANCE_DOMAIN: ${FINANCE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      app:
        ipv4_address: 172.30.0.10

networks:
  app:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
