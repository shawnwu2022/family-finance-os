services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      FINANCE_DB_NAME: ${FINANCE_DB_NAME:-finance}
      FINANCE_DB_USER: ${FINANCE_DB_USER:-finance_app}
      FINANCE_DB_PASSWORD: ${FINANCE_DB_PASSWORD}
      EBK_DB_NAME: ${EBK_DB_NAME:-ezbookkeeping}
      EBK_DB_USER: ${EBK_DB_USER:-ezbookkeeping_app}
      EBK_DB_PASSWORD: ${EBK_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-postgres} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  ezbookkeeping:
    image: mayswind/ezbookkeeping:1.6.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      EBK_SERVER_DOMAIN: ${BOOK_HOST}
      EBK_SERVER_ROOT_URL: https://${BOOK_HOST}/
      EBK_DATABASE_TYPE: postgres
      EBK_DATABASE_HOST: postgres:5432
      EBK_DATABASE_NAME: ${EBK_DB_NAME:-ezbookkeeping}
      EBK_DATABASE_USER: ${EBK_DB_USER:-ezbookkeeping_app}
      EBK_DATABASE_PASSWD: ${EBK_DB_PASSWORD}
      EBK_SECURITY_SECRET_KEY: ${EBK_SECRET_KEY}
      EBK_SERVER_ENABLE_API_TOKEN: ${EBK_ENABLE_API_TOKEN:-true}
    volumes:
      - ezbookkeeping_storage:/ezbookkeeping/data

  finance-core:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ezbookkeeping:
        condition: service_started
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      DB_NAME: ${FINANCE_DB_NAME:-finance}
      DB_USER: ${FINANCE_DB_USER:-finance_app}
      DB_PASSWORD: ${FINANCE_DB_PASSWORD}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      EBK_BASE_URL: ${EBK_BASE_URL:-http://ezbookkeeping:8080/api/v1}
      EBK_API_TOKEN: ${EBK_API_TOKEN}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_FAST_MODEL: ${LLM_FAST_MODEL}
      LLM_PLANNER_MODEL: ${LLM_PLANNER_MODEL}
      LLM_REVIEWER_MODEL: ${LLM_REVIEWER_MODEL}
    healthcheck:
      test: ["CMD", "/finance-core", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      finance-core:
        condition: service_healthy
      ezbookkeeping:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    environment:
      FINANCE_HOST: ${FINANCE_HOST}
      BOOK_HOST: ${BOOK_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  ezbookkeeping_storage:
  caddy_data:
  caddy_config:
