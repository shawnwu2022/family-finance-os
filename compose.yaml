services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_INITDB_ARGS: --data-checksums
      FINANCE_DB_NAME: ${FINANCE_DB_NAME:-finance}
      FINANCE_DB_USER: ${FINANCE_DB_USER:-finance_app}
      FINANCE_DB_PASSWORD: ${FINANCE_DB_PASSWORD}
      EBK_DB_NAME: ${EBK_DB_NAME:-ezbookkeeping}
      EBK_DB_USER: ${EBK_DB_USER:-ezbookkeeping_app}
      EBK_DB_PASSWORD: ${EBK_DB_PASSWORD}
    volumes:
      # PostgreSQL 18+ official image: mount the parent path /var/lib/postgresql.
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app]

  ezbookkeeping:
    image: mayswind/ezbookkeeping:1.6.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      EBK_SERVER_DOMAIN: ${EBK_DOMAIN}
      EBK_SERVER_ROOT_URL: https://${EBK_DOMAIN}/
      EBK_SERVER_ENABLE_GZIP: "true"
      EBK_DATABASE_TYPE: postgres
      EBK_DATABASE_HOST: postgres:5432
      EBK_DATABASE_NAME: ${EBK_DB_NAME:-ezbookkeeping}
      EBK_DATABASE_USER: ${EBK_DB_USER:-ezbookkeeping_app}
      EBK_DATABASE_PASSWD: ${EBK_DB_PASSWORD}
      EBK_DATABASE_SSL_MODE: disable
      EBK_SECURITY_SECRET_KEY: ${EBK_SECURITY_SECRET_KEY}
      EBK_SECURITY_ENABLE_API_TOKEN: "true"
      EBK_LOG_MODE: console
    volumes:
      - ./data/ezbookkeeping-storage:/ezbookkeeping/storage
    networks: [app]

  finance-core:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ezbookkeeping:
        condition: service_started
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      DB_NAME: ${FINANCE_DB_NAME:-finance}
      DB_USER: ${FINANCE_DB_USER:-finance_app}
      DB_PASSWORD: ${FINANCE_DB_PASSWORD}
      EBK_BASE_URL: ${EBK_BASE_URL:-http://ezbookkeeping:8080/api/v1}
      EBK_API_TOKEN: ${EBK_API_TOKEN:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_FAST_MODEL: ${LLM_FAST_MODEL:-}
      LLM_PLANNER_MODEL: ${LLM_PLANNER_MODEL:-}
      LLM_REVIEWER_MODEL: ${LLM_REVIEWER_MODEL:-}
      FINANCE_LISTEN_ADDR: ${FINANCE_LISTEN_ADDR:-:8000}
      FINANCE_HEALTHCHECK_URL: ${FINANCE_HEALTHCHECK_URL:-http://127.0.0.1:8000/healthz}
    healthcheck:
      test: ["CMD", "/finance-core", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [app]

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      - ezbookkeeping
      - finance-core
    environment:
      EBK_DOMAIN: ${EBK_DOMAIN}
      FINANCE_DOMAIN: ${FINANCE_DOMAIN}
      FINANCE_AUTH_USER: ${FINANCE_AUTH_USER:?FINANCE_AUTH_USER is required}
      FINANCE_AUTH_HASH: ${FINANCE_AUTH_HASH:?FINANCE_AUTH_HASH is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [app]

networks:
  app:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
