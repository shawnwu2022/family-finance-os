services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: finance_app
      POSTGRES_PASSWORD: test-secret
      POSTGRES_DB: finance
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_app -d finance"]
      interval: 5s
      timeout: 5s
      retries: 20

  go:
    build:
      context: .
      dockerfile: ci/go.Dockerfile
    working_dir: /src
    volumes:
      - .:/src:ro
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    environment:
      TEST_POSTGRES_HOST: postgres
      TEST_POSTGRES_PORT: "5432"
      TEST_POSTGRES_DB: finance
      TEST_POSTGRES_USER: finance_app
      TEST_POSTGRES_PASSWORD: test-secret
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: node:24.19.0-bookworm
    working_dir: /src/web
    volumes:
      - .:/src:ro
      - npm-cache:/root/.npm

volumes:
  go-mod-cache:
  go-build-cache:
  npm-cache:
