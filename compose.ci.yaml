services:
  postgres:
    image: postgres:18.6@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
    environment:
      POSTGRES_USER: finance_app
      POSTGRES_PASSWORD: test-secret
      POSTGRES_DB: finance
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_app -d finance"]
      interval: 5s
      timeout: 5s
      retries: 20

  go:
    build:
      context: .
      dockerfile: ci/go.Dockerfile
    working_dir: /src
    volumes:
      - .:/src:ro
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    environment:
      TEST_POSTGRES_HOST: postgres
      TEST_POSTGRES_PORT: "5432"
      TEST_POSTGRES_DB: finance
      TEST_POSTGRES_USER: finance_app
      TEST_POSTGRES_PASSWORD: test-secret
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: node:24.19.0-bookworm-slim@sha256:3638d9a6fe4030bd716be989438248074489337ba3275657f93595428be4fc03
    working_dir: /src/web
    volumes:
      - .:/src:ro
      - npm-cache:/root/.npm

volumes:
  go-mod-cache:
  go-build-cache:
  npm-cache:
